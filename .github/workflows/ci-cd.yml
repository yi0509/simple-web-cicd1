name: Flask CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 运行测试
      run: pytest test_app.py -v
      
    - name: 构建 Docker 镜像
      run: docker build -t crpi-heewbtjp6mdcsq3.cn-guangzhou.personal.cr.aliyuncs.com/simple-web-cicd1:${{ github.sha }} .
      
    - name: 登录阿里云容器镜像服务
      run: echo ${{ secrets.ALIYUN_PASSWORD }} | docker login --username=${{ secrets.ALIYUN_USERNAME }} --password-stdin crpi-heewbtjp6mdcsq3.cn-guangzhou.personal.cr.aliyuncs.com
        
    - name: 推送镜像到阿里云容器镜像服务
      run: docker push crpi-heewbtjp6mdcsq3.cn-guangzhou.personal.cr.aliyuncs.com/simple-web-cicd1:${{ github.sha }}
      
    - name: 部署到 ECS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          docker login -u ${{ secrets.ALIYUN_USERNAME }} -p ${{ secrets.ALIYUN_PASSWORD }} crpi-heewbtjp6mdcsq3.cn-guangzhou.personal.cr.aliyuncs.com
          docker pull crpi-heewbtjp6mdcsq3.cn-guangzhou.personal.cr.aliyuncs.com/simple-web-cicd1:${{ github.sha }}
          docker stop simple-web-cicd1 || true
          docker rm simple-web-cicd1 || true
          docker run -d --name simple-web-cicd1 -p 80:80 crpi-heewbtjp6mdcsq3.cn-guangzhou.personal.cr.aliyuncs.com/simple-web-cicd1:${{ github.sha }}
          docker logout
