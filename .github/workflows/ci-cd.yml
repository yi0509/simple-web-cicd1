name: Flask CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 运行测试
      run: pytest test_app.py -v
      
    - name: 部署到 ECS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          cd /opt
          rm -rf simple-web-cicd1
          git clone https://github.com/yi0509/simple-web-cicd1.git
          cd simple-web-cicd1
          docker stop simple-web-cicd1 || true
          docker rm simple-web-cicd1 || true
          docker build -t simple-web-cicd1:latest .
          docker run -d --name simple-web-cicd1 -p 80:80 simple-web-cicd1:latest
