name: Flask CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 运行测试
      run: pytest test_app.py -v
      
    - name: 构建 Docker 镜像
      run: docker build -t simple-web-cicd1:${{ github.sha }} .
      
    - name: 导出镜像为 tar 文件
      run: |
        docker save -o simple-web-cicd1.tar simple-web-cicd1:${{ github.sha }}
        ls -la simple-web-cicd1.tar
      
    - name: 传输镜像到 ECS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT }}
        source: simple-web-cicd1.tar
        target: /tmp/
        
    - name: 部署到 ECS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          docker load -i /tmp/simple-web-cicd1.tar
          docker stop simple-web-cicd1 || true
          docker rm simple-web-cicd1 || true
          docker run -d --name simple-web-cicd1 -p 80:80 simple-web-cicd1:${{ github.sha }}
          rm -f /tmp/simple-web-cicd1.tar
